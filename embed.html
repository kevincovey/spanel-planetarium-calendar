<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spanel Planetarium — Calendar</title>
<!--
  Embeddable calendar renderer. Draws one of the published .ics feeds as a real
  month/agenda calendar so it can be dropped into a Drupal page via <iframe>.

  Query parameters:
    cal   = availability | staff   (default: availability)
    view  = month | list           (default: month)
    date  = YYYY-MM-DD              (optional: month to open on)

  Examples:
    embed.html?cal=availability
    embed.html?cal=staff&view=list
-->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
<style>
  :root{
    --brand:#2b3a67; --line:#e3e7f0; --ink:#1b2333; --muted:#667085;
    --avail-bg:#dcf3ec; --avail-ink:#0f6b57; --avail-line:#8fd6c4;
    --tent-bg:#fff3d6;  --tent-ink:#8a5a00;  --tent-line:#f0c65a;
    --conf-bg:#dcf3e3;  --conf-ink:#17663a;  --conf-line:#7fce9f;
  }
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{padding:12px 14px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    font-size:12px;color:var(--muted);margin:0 2px 10px;}
  .legend .s{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:13px;height:13px;border-radius:4px;border:1px solid;display:inline-block;}
  .sw.avail{background:var(--avail-bg);border-color:var(--avail-line);}
  .sw.tent{background:var(--tent-bg);border-color:var(--tent-line);}
  .sw.conf{background:var(--conf-bg);border-color:var(--conf-line);}
  #msg{padding:24px;text-align:center;color:var(--muted);font-size:14px;}
  /* FullCalendar tuning */
  .fc{--fc-border-color:var(--line);--fc-today-bg-color:#fff7e6;font-size:13px;}
  .fc .fc-toolbar-title{font-size:1.05rem;color:var(--brand);}
  .fc .fc-button-primary{background:var(--brand);border-color:var(--brand);
    text-transform:capitalize;box-shadow:none;}
  .fc .fc-button-primary:not(:disabled):hover{background:#22305a;border-color:#22305a;}
  .fc .fc-button-primary:disabled{background:#9aa4c0;border-color:#9aa4c0;}
  .fc-event{border-radius:5px;padding:0 3px;font-size:11px;border-width:1px;}
  .ev-avail{background:var(--avail-bg)!important;border-color:var(--avail-line)!important;color:var(--avail-ink)!important;}
  .ev-avail .fc-event-time{display:none;}   /* availability: hide time clutter, "Available" says enough */
  .ev-tent{background:var(--tent-bg)!important;border-color:var(--tent-line)!important;color:var(--tent-ink)!important;}
  .ev-conf{background:var(--conf-bg)!important;border-color:var(--conf-line)!important;color:var(--conf-ink)!important;}
  .fc-daygrid-event{white-space:normal;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="legend" id="legend"></div>
    <div id="calendar"></div>
    <div id="msg" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.15/index.global.min.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var cal = (p.get("cal") === "staff") ? "staff" : "availability";
      var view = (p.get("view") === "list") ? "listMonth" : "dayGridMonth";
      var date = p.get("date") || undefined;

      var feed = cal === "staff" ? "staff-calendar.ics" : "availability.ics";
      var legend = document.getElementById("legend");
      if (cal === "staff") {
        legend.innerHTML =
          '<span class="s"><span class="sw conf"></span> Confirmed (paid)</span>' +
          '<span class="s"><span class="sw tent"></span> Tentative</span>';
      } else {
        legend.innerHTML = '<span class="s"><span class="sw avail"></span> Available show time</span>';
      }

      function showMsg(t){ var m=document.getElementById("msg"); m.textContent=t; m.hidden=false; }

      var calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: view,
        initialDate: date,
        height: "auto",
        firstDay: 0,
        headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,listMonth" },
        buttonText: { today: "Today", month: "Month", list: "List" },
        noEventsText: cal === "staff" ? "No shows scheduled." : "No open times in this month.",
        displayEventTime: cal === "staff",
        eventTimeFormat: { hour: "numeric", minute: "2-digit", meridiem: "narrow" },
        eventClassNames: function (arg) {
          if (cal === "availability") return ["ev-avail"];
          return String(arg.event.title).indexOf("(Tentative)") === 0 ? ["ev-tent"] : ["ev-conf"];
        },
        events: {
          url: feed,
          format: "ics",
          failure: function () { showMsg("Could not load the calendar feed yet. It refreshes hourly — check back shortly."); }
        },
        loading: function (isLoading) { if (!isLoading) { /* rendered */ } }
      });
      calendar.render();
    })();
  </script>
</body>
</html>
