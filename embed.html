<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spanel Planetarium — Calendar</title>
<!--
  Embeddable calendar renderer. Draws the published .ics feeds as a real
  month/agenda calendar so it can be dropped into a Drupal page via <iframe>.

  Query parameters:
    cal   = availability | staff | both     (default: availability)
              - availability : open slots only (public-safe)
              - staff        : booked shows only (shows group names)
              - both         : both feeds, with checkboxes so the viewer can
                               toggle each on/off (use on staff/internal pages)
    view  = month | list                     (default: month)
    date  = YYYY-MM-DD                        (optional: month to open on)

  NOTE: the staff feed contains group names (never contact info). Only use
  cal=staff or cal=both on an internal/staff page.
-->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
<style>
  :root{
    --brand:#2b3a67; --line:#e3e7f0; --ink:#1b2333; --muted:#667085;
    --avail-bg:#e4eefb; --avail-ink:#2456a0; --avail-line:#a8c6ee;   /* blue = available */
    --tent-bg:#fff3d6;  --tent-ink:#8a5a00;  --tent-line:#f0c65a;    /* amber = tentative */
    --conf-bg:#dcf3e3;  --conf-ink:#17663a;  --conf-line:#7fce9f;    /* green = confirmed */
  }
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{padding:12px 14px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin:0 2px 10px;}
  .controls{display:flex;align-items:center;gap:10px;font-size:13px;}
  .controls .ctl-label{color:var(--muted);font-weight:600;}
  .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;user-select:none;font-weight:600;}
  .chk input{margin:0;cursor:pointer;}
  .chk .dot{width:11px;height:11px;border-radius:3px;border:1px solid;}
  .chk .dot.avail{background:var(--avail-bg);border-color:var(--avail-line);}
  .chk .dot.staff{background:var(--conf-bg);border-color:var(--conf-line);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);}
  .legend .s{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:13px;height:13px;border-radius:4px;border:1px solid;display:inline-block;}
  .sw.avail{background:var(--avail-bg);border-color:var(--avail-line);}
  .sw.tent{background:var(--tent-bg);border-color:var(--tent-line);}
  .sw.conf{background:var(--conf-bg);border-color:var(--conf-line);}
  #msg{padding:24px;text-align:center;color:var(--muted);font-size:14px;}
  .fc{--fc-border-color:var(--line);--fc-today-bg-color:#fff7e6;font-size:13px;}
  .fc .fc-toolbar-title{font-size:1.05rem;color:var(--brand);}
  .fc .fc-button-primary{background:var(--brand);border-color:var(--brand);
    text-transform:capitalize;box-shadow:none;}
  .fc .fc-button-primary:not(:disabled):hover{background:#22305a;border-color:#22305a;}
  .fc .fc-button-primary:disabled{background:#9aa4c0;border-color:#9aa4c0;}
  .fc-event{border-radius:5px;padding:0 3px;font-size:11px;border-width:1px;}
  .ev-avail{background:var(--avail-bg)!important;border-color:var(--avail-line)!important;color:var(--avail-ink)!important;}
  .ev-avail .fc-event-time{display:none;}   /* time is folded into the title instead */
  .ev-tent{background:var(--tent-bg)!important;border-color:var(--tent-line)!important;color:var(--tent-ink)!important;}
  .ev-conf{background:var(--conf-bg)!important;border-color:var(--conf-line)!important;color:var(--conf-ink)!important;}
  .fc-daygrid-event{white-space:normal;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="controls" id="controls" hidden><span class="ctl-label">Show:</span></div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="calendar"></div>
    <div id="msg" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.15/index.global.min.js"></script>
  <script>
    (function () {
      var FEEDS = {
        availability: { id: "avail",  url: "availability.ics",   label: "Available times" },
        staff:        { id: "staff",  url: "staff-calendar.ics", label: "Booked shows" }
      };

      var p = new URLSearchParams(location.search);
      var view = (p.get("view") === "list") ? "listMonth" : "dayGridMonth";
      var date = p.get("date") || undefined;

      // Which feeds are ENABLED (selectable) in this embed.
      var calParam = (p.get("cal") || "availability").toLowerCase();
      var enabled;
      if (calParam === "both") enabled = ["availability", "staff"];
      else if (calParam.indexOf(",") > -1) enabled = calParam.split(",").map(function (s){return s.trim();}).filter(function (k){return FEEDS[k];});
      else if (FEEDS[calParam]) enabled = [calParam];
      else enabled = ["availability"];
      if (!enabled.length) enabled = ["availability"];

      // Live on/off state per feed (all on initially).
      var on = {}; enabled.forEach(function (k){ on[k] = true; });

      function fmtTime(d) {
        var h = d.getHours(), m = d.getMinutes();
        var ap = h < 12 ? "am" : "pm", h12 = h % 12; if (h12 === 0) h12 = 12;
        return m ? h12 + ":" + String(m).padStart(2, "0") + ap : h12 + ap;
      }
      function showMsg(t){ var m=document.getElementById("msg"); m.textContent=t; m.hidden=false; }

      var calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: view,
        initialDate: date,
        height: "auto",
        firstDay: 0,
        headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,listMonth" },
        buttonText: { today: "Today", month: "Month", list: "List" },
        noEventsText: "Nothing to show for this month.",
        displayEventTime: true,
        eventTimeFormat: { hour: "numeric", minute: "2-digit", meridiem: "narrow" },
        eventClassNames: function (arg) {
          var src = arg.event.source && arg.event.source.id;
          if (src === "avail") return ["ev-avail"];
          return String(arg.event.title).indexOf("(Tentative)") === 0 ? ["ev-tent"] : ["ev-conf"];
        },
        eventDidMount: function (arg) {
          // Availability entries: fold the start time into the title -> "10am - Available".
          if (arg.event.source && arg.event.source.id === "avail" && arg.event.start) {
            var el = arg.el.querySelector(".fc-event-title");
            if (el) el.textContent = fmtTime(arg.event.start) + " - " + arg.event.title;
          }
        }
      });

      // Add the initially-on sources.
      enabled.forEach(function (k) {
        if (on[k]) calendar.addEventSource({
          id: FEEDS[k].id, url: FEEDS[k].url, format: "ics",
          failure: function () { showMsg("Could not load a calendar feed yet. Feeds refresh hourly — check back shortly."); }
        });
      });

      function toggleFeed(k, want) {
        on[k] = want;
        var existing = calendar.getEventSourceById(FEEDS[k].id);
        if (want && !existing) {
          calendar.addEventSource({ id: FEEDS[k].id, url: FEEDS[k].url, format: "ics" });
        } else if (!want && existing) {
          existing.remove();
        }
        renderLegend();
      }

      function renderControls() {
        var c = document.getElementById("controls");
        if (enabled.length < 2) { c.hidden = true; return; }   // single feed -> no chooser
        c.hidden = false;
        enabled.forEach(function (k) {
          var lab = document.createElement("label"); lab.className = "chk";
          var box = document.createElement("input"); box.type = "checkbox"; box.checked = on[k]; box.setAttribute("data-feed", k);
          var dot = document.createElement("span"); dot.className = "dot " + (k === "availability" ? "avail" : "staff");
          var txt = document.createTextNode(" " + FEEDS[k].label);
          box.addEventListener("change", function () { toggleFeed(k, box.checked); });
          lab.appendChild(box); lab.appendChild(dot); lab.appendChild(txt);
          c.appendChild(lab);
        });
      }

      function renderLegend() {
        var items = [];
        if (on.availability) items.push('<span class="s"><span class="sw avail"></span> Available show time</span>');
        if (on.staff) items.push(
          '<span class="s"><span class="sw conf"></span> Confirmed (paid)</span>' +
          '<span class="s"><span class="sw tent"></span> Tentative</span>');
        document.getElementById("legend").innerHTML = items.join("");
      }

      renderControls();
      renderLegend();
      calendar.render();
    })();
  </script>
</body>
</html>
